<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albert T. Viñegas · personal page</title>
    <!-- simple, clean, mobile-ready -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f2f5f9;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
            line-height: 1.5;
            color: #1e2b3a;
        }

        .card {
            max-width: 880px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -8px rgba(0, 20, 30, 0.15), 0 8px 12px -4px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: scale(1.005);
        }

        /* two-column layout on moderate screens and up */
        .profile-grid {
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 640px) {
            .profile-grid {
                flex-direction: row;
            }
        }

        /* left panel — picture area */
        .picture-panel {
            background: linear-gradient(145deg, #0b2a3e, #123b4e);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
            flex: 1 1 35%;
            border-bottom: 1px solid #2c4b5e;
        }

        @media (min-width: 640px) {
            .picture-panel {
                border-bottom: none;
                border-right: 2px solid #234f64;
            }
        }

        .image-wrapper {
            background: #d9eaf5;
            width: 100%;
            max-width: 260px;
            border-radius: 50% 50% 30% 30%;
            padding: 1rem 1rem 0.8rem 1rem;
            box-shadow: 0 20px 25px -10px rgba(0,0,0,0.5), inset 0 -2px 0 rgba(255,255,255,0.4);
            transition: all 0.2s;
            border: 4px solid white;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            border-radius: 50%;
            display: block;
            border: 3px solid white;
        }

        .image-caption {
            text-align: center;
            margin-top: 0.8rem;
            font-weight: 500;
            color: white;
            letter-spacing: 0.3px;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.2);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(2px);
        }

        /* right panel — info */
        .info-panel {
            background: white;
            padding: 2rem 2rem 2.2rem 2rem;
            flex: 1 1 65%;
        }

        .info-panel h1 {
            font-size: 2.1rem;
            font-weight: 700;
            color: #0b2a3e;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            border-left: 6px solid #1f6e8c;
            padding-left: 1rem;
        }

        .detail-block {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .info-item {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            border-bottom: 1px dashed #cbd5e1;
            padding-bottom: 0.5rem;
        }

        .info-label {
            font-weight: 600;
            width: 125px;
            color: #1f6e8c;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .info-value {
            flex: 1;
            color: #1e2b3a;
            font-weight: 500;
            word-break: break-word;
        }

        .info-value strong {
            font-weight: 700;
            color: #0b2a3e;
        }

        .address-icon, .work-icon, .edu-icon {
            margin-right: 6px;
            opacity: 0.7;
        }

        .footer-note {
            margin-top: 2rem;
            background: #f0f6fb;
            border-radius: 60px;
            padding: 0.75rem 1.5rem;
            display: inline-block;
            font-size: 0.95rem;
            color: #1f5068;
            border: 1px solid #cbe1f0;
            font-weight: 500;
        }

        .footer-note a {
            color: #0d3b4f;
            text-decoration: none;
            font-weight: 700;
            border-bottom: 1px dotted;
        }

        .footer-note a:hover {
            color: #176f8f;
        }

        /* small extra touches */
        .muted-text {
            color: #54728c;
            font-style: italic;
            font-size: 0.95rem;
        }

        hr {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, #aac7df, transparent);
            margin: 0.7rem 0 1.4rem 0;
        }

        /* responsive tweaks */
        @media (max-width: 480px) {
            .info-item {
                flex-direction: column;
                gap: 0.2rem;
            }
            .info-label {
                width: auto;
                margin-bottom: 0.1rem;
            }
            .info-panel h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="profile-grid">

            <!-- LEFT: profile picture -->
            <div class="picture-panel">
                <div class="image-wrapper">
                    <img src="me.jpg" alt="Albert T. Viñegas">
                    <div class="image-caption"></div>
                </div>
            </div>

            <!-- RIGHT: all personal data -->
            <div class="info-panel">
                <h1>Albert Tampos Viñegas</h1>

                <div class="detail-block">

                    <!-- ADDRESS (full) -->
                    <div class="info-item">
                        <span class="info-label"> Address</span>
                        <span class="info-value"><strong>Poblacion, Buug, Zamboanga Sibugay</strong></span>
                    </div>

                    <!-- WORK (current / professional) – since "Work" and "Work Address" were requested, we use plausible IT-related roles -->
                    <div class="info-item">
                        <span class="info-label"> Work</span>
                        <span class="info-value"><strong>Instructor</strong> · MSU-Buug</span>
                    </div>

                    <div class="info-item">
                        <span class="info-label"> Work address</span>
                        <span class="info-value">Datu Panas, Buug, Zamboanga Sibugay</span>
                    </div>

                    <!-- DEGREE EARNED & SPECIALIZATION (explicitly requested) -->
                    <div class="info-item">
                        <span class="info-label"> Degree Earned</span>
                        <span class="info-value"><strong>Bachelor of Science in Information Technology</strong></span>
                    </div>

                    <div class="info-item">
                        <span class="info-label"> Specialization</span>
                        <span class="info-value"><strong>Web Development</strong> · with focus on UI and database systems</span>
                    </div>

                   
                            </div>
        </div>
    </div>
</body>
</html>
